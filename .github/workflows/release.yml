name: Release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx --yes @vscode/vsce package --no-dependencies
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: '*.vsix'
          generate_release_notes: true
      # Store publishing runs only when you have added the account tokens as repository secrets (Settings -> Secrets and variables -> Actions).
      - name: Publish to the VS Code Marketplace (skipped unless the VSCE_PAT secret exists)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then npx --yes @vscode/vsce publish --no-dependencies --packagePath ./*.vsix -p "$VSCE_PAT"; else echo "VSCE_PAT is not set: skipping the Marketplace"; fi
      - name: Publish to Open VSX (skipped unless the OVSX_PAT secret exists)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then npx --yes ovsx publish ./*.vsix -p "$OVSX_PAT"; else echo "OVSX_PAT is not set: skipping Open VSX"; fi
