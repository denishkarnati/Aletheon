<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="Animation: a datasheet line is quoted into an evidence ledger, then an answer is checked: one claim verified, two flagged.">
  <style>
    :root{--ink:#0B0D10;--panel:#111A2E;--line:#25324F;--text:#E8ECF4;--mute:#8C9AB8;--amber:#F4F5F7;--green:#3DDC97;--red:#FF6B6B}
    text{font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;font-size:13px;fill:var(--text)}
    .h{font-family:"Segoe UI",Inter,system-ui,sans-serif;font-size:12px;fill:var(--mute);letter-spacing:.12em;text-transform:uppercase}
    .m{fill:var(--mute)} .a{fill:var(--amber)} .g{fill:var(--green)} .r{fill:var(--red)}
    .card{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
    .loop{animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease-out;opacity:0}
    @keyframes s1{0%,6%{opacity:0}9%,94%{opacity:1}100%{opacity:0}}
    @keyframes s2{0%,20%{opacity:0;transform:translateX(-14px)}24%,94%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes s3{0%,32%{opacity:0;transform:translateX(-14px)}36%,94%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes s4{0%,46%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
    @keyframes s5{0%,60%{opacity:0}64%,94%{opacity:1}100%{opacity:0}}
    @keyframes s6{0%,72%{opacity:0}76%,94%{opacity:1}100%{opacity:0}}
    @keyframes glow{0%,6%{opacity:0}9%,94%{opacity:.9}100%{opacity:0}}
    .a1{animation-name:s1}.a2{animation-name:s2}.a3{animation-name:s3}.a4{animation-name:s4}.a5{animation-name:s5}.a6{animation-name:s6}.gl{animation-name:glow}
    @media (prefers-reduced-motion:reduce){.loop{animation:none;opacity:1;transform:none}}
  </style>
  <rect width="860" height="440" rx="16" fill="var(--ink)"/>
  <!-- datasheet -->
  <text class="h" x="40" y="46">1 · Datasheet</text>
  <rect class="card" x="28" y="62" width="250" height="300" rx="10"/>
  <text class="m" x="44" y="90">Table 424. UART0 registers</text>
  <text class="m" x="44" y="120">0x000  UARTDR   Data</text>
  <text class="m" x="44" y="144">0x004  UARTRSR  Receive status</text>
  <rect class="loop gl" x="38" y="156" width="232" height="26" rx="5" fill="#F4F5F7" fill-opacity=".18" stroke="#F4F5F7"/>
  <text x="44" y="174">0x018  UARTFR   Flag</text>
  <text class="m" x="44" y="204">0x020  UARTILPR IrDA low-power</text>
  <text class="m" x="44" y="228">0x024  UARTIBRD Integer baud</text>
  <text class="m" x="44" y="252">0x028  UARTFBRD Fractional baud</text>
  <text class="m" x="44" y="276">0x02C  UARTLCR_H Line control</text>
  <text class="m" x="44" y="340" font-size="11">page 430 · vendor-official</text>
  <!-- arrow -->
  <path class="loop a1" d="M286 170h38l-9-8m9 8-9 8" stroke="#F4F5F7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ledger -->
  <text class="h" x="338" y="46">2 · Evidence ledger</text>
  <rect class="card" x="332" y="62" width="250" height="300" rx="10"/>
  <g class="loop a2"><rect x="344" y="80" width="226" height="62" rx="8" fill="#0B0D10" stroke="#F4F5F7"/>
    <text class="a" x="356" y="102">[E5] datasheet p.430</text><text class="m" x="356" y="122" font-size="11">vendor-official · be56fbb7…</text></g>
  <g class="loop a3"><rect x="344" y="152" width="226" height="62" rx="8" fill="#0B0D10" stroke="#F4F5F7"/>
    <text class="a" x="356" y="174">[E4] svd UART0.UARTFR</text><text class="m" x="356" y="194" font-size="11">vendor-official · @0x40034018</text></g>
  <g class="loop a4"><rect x="344" y="224" width="226" height="52" rx="8" fill="#0B0D10" stroke="#3DDC97"/>
    <text class="g" x="356" y="246">AGREE</text><text class="m" x="356" y="264" font-size="11">SVD and datasheet agree</text></g>
  <!-- arrow 2 -->
  <path class="loop a4" d="M590 170h38l-9-8m9 8-9 8" stroke="#F4F5F7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- answer -->
  <text class="h" x="640" y="46">3 · Audited answer</text>
  <rect class="card" x="634" y="62" width="198" height="300" rx="10"/>
  <g class="loop a4"><text x="646" y="94" font-size="12">UARTFR is at</text><text x="646" y="112" font-size="12">0x40034018 [E4]</text>
    <text class="g" x="646" y="134" font-size="12">✓ supported</text></g>
  <g class="loop a5"><text x="646" y="176" font-size="12">UART data reg is at</text><text x="646" y="194" font-size="12">0x40034004</text>
    <text class="r" x="646" y="216" font-size="12">✗ no evidence cited</text></g>
  <g class="loop a6"><text x="646" y="258" font-size="12">Core runs at 266 MHz</text><text x="646" y="276" font-size="12">[E99]</text>
    <text class="r" x="646" y="298" font-size="12">✗ E99 does not exist</text></g>
  <text class="m" x="40" y="410" font-size="12">Every hardware value must point at evidence that actually contains it.</text>
  <text class="a" x="740" y="410" font-size="12" text-anchor="end">aletheon</text>
</svg>
